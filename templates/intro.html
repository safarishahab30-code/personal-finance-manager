<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تراز | TARAZ — سامانه مدیریت هوشمند مالی</title>

  <style>
    :root{
      --accent:#8b5cf6;
      --accent-glow:#6d28d9;
      --accent-light:#c084fc;
      --bg-dark:#030712;
      --card-bg:rgba(17,24,39,.60);
      --border-glow:rgba(139,92,246,.35);

      /* Motion / Effects knobs (controlled by settings) */
      --tilt: 1;              /* 0..1 */
      --parallax: 1;          /* 0..1 */
      --mouseLight: 1;        /* 0..1 */
      --shimmer: 1;           /* 0..1 */
      --typewriter: 1;        /* 0..1 */
      --particles: 1;         /* 0..1 */
      --orbs: 1;              /* 0..1 */

      --tilt-max: 10deg;      /* max rotation */
      --tilt-perspective: 900px;

      --toast-z: 9999;
      --ui-z: 50;

      --radius: 32px;
      --shadow: 0 25px 60px rgba(0,0,0,.65), 0 0 45px rgba(139,92,246,.18);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background-color:var(--bg-dark);
      background-image: radial-gradient(circle at 50% 50%, rgba(139,92,246,.16) 0%, #030712 65%);
      color:#f8fafc;
      font-family:'Segoe UI',Tahoma,sans-serif;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      transition:background .08s ease-out;
    }

    /* ۱. شبکه شطرنجی سایبری */
    .bg-grid{
      position:absolute; inset:0;
      background-image:
        linear-gradient(to right, rgba(139,92,246,.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(139,92,246,.08) 1px, transparent 1px);
      background-size:45px 45px;
      z-index:0;
      pointer-events:none;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,.9), transparent 70%);
      opacity:.9;
    }

    /* ۲. هاله‌های نورانی بنفش متحرک */
    .orb{
      position:absolute;
      width:460px;height:460px;
      border-radius:50%;
      filter:blur(140px);
      opacity:calc(0.22 * var(--orbs));
      z-index:1;
      pointer-events:none;
      animation:moveOrb 12s infinite alternate ease-in-out;
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    .orb-1{background:var(--accent); top:5%; left:10%;}
    .orb-2{
      background:#d946ef;
      bottom:5%; right:10%;
      animation-delay:-6s;
    }

    /* ۳. ذرات درخشان معلق */
    .particle{
      position:absolute;
      width:5px;height:5px;
      background:var(--accent-light);
      border-radius:50%;
      box-shadow:0 0 10px var(--accent-light), 0 0 20px var(--accent);
      animation:pulseParticle 3s infinite alternate ease-in-out;
      z-index:1;
      pointer-events:none;
      opacity: calc(1 * var(--particles));
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
    }
    .p1{top:22%; left:22%;}
    .p2{top:78%; left:26%; animation-delay:1.2s;}
    .p3{top:18%; right:24%; animation-delay:2s;}
    .p4{bottom:22%; right:22%; animation-delay:.7s;}

    /* ۴. ویجت‌های شناور دور کادر */
    .floating-badge{
      position:absolute;
      background:rgba(15,23,42,.75);
      border:1px solid var(--border-glow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding:12px 20px;
      border-radius:16px;
      font-size:.85rem;
      color:#e2e8f0;
      box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 18px rgba(139,92,246,.2);
      animation:floatBadge 4.5s ease-in-out infinite alternate;
      z-index:2;
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:none;
      user-select:none;
    }
    .floating-badge b{color:var(--accent-light); font-weight:700;}
    .badge-top-left{top:14%; left:10%; animation-delay:0s;}
    .badge-top-right{top:12%; right:10%; animation-delay:1.6s;}
    .badge-bottom-left{bottom:14%; left:12%; animation-delay:.9s;}
    .badge-bottom-right{bottom:16%; right:12%; animation-delay:2.4s;}

    /* ۵. مینی‌چارت‌های نبض‌دار گوشه‌ها */
    .live-chart{
      position:absolute;
      bottom:35px;
      display:flex;
      align-items:flex-end;
      gap:6px;
      padding:10px 14px;
      background:rgba(15,23,42,.5);
      border:1px solid rgba(139,92,246,.2);
      border-radius:12px;
      backdrop-filter: blur(8px);
      z-index:2;
      pointer-events:none;
    }
    .chart-left{left:35px;}
    .chart-right{right:35px;}
    .live-chart span{
      display:block;
      width:5px;
      height:var(--h);
      background:linear-gradient(to top,var(--accent-glow),var(--accent-light));
      border-radius:4px;
      transform-origin:bottom;
      animation:barPulse 1.6s infinite alternate ease-in-out;
      animation-delay:var(--d);
      box-shadow:0 0 8px rgba(168,85,247,.4);
    }

    /* ۶. کادر شیشه‌ای اصلی + 3D tilt */
    .card-wrap{
      perspective: var(--tilt-perspective);
      z-index:3;
      width:min(520px, 90%);
    }
    .glass-card{
      position:relative;
      background:var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border:1px solid rgba(255,255,255,.12);
      padding:55px 75px;
      border-radius:var(--radius);
      text-align:center;
      box-shadow: var(--shadow);
      max-width:520px;
      width:100%;
      animation:cardEntrance 1.1s ease-out;
      transform-style:preserve-3d;
      will-change: transform;
      overflow:hidden;
    }

    .glass-card::before{
      content:"";
      position:absolute; inset:-80px;
      background: radial-gradient(circle at var(--hx, 50%) var(--hy, 40%),
        rgba(255,255,255,.10), transparent 55%);
      opacity:.9;
      transform: translateZ(35px);
      pointer-events:none;
      transition: opacity .25s ease;
    }

    .glass-card::after{
      content:"";
      position:absolute; inset:0;
      border-radius:var(--radius);
      padding:1px;
      background: linear-gradient(130deg,
        rgba(139,92,246,.55),
        rgba(217,70,239,.25),
        rgba(96,165,250,.18),
        rgba(139,92,246,.55)
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity:.35;
      animation:borderFlow 4.5s linear infinite;
      pointer-events:none;
    }

    .deco-line{
      position:absolute;
      width:3px;height:90px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      left:-1px; top:25%;
      transform: translateZ(50px);
    }

    .logo-section{
      font-size:64px;
      margin-bottom:14px;
      filter: drop-shadow(0 0 25px var(--accent));
      animation:pulseIcon 2.4s infinite ease-in-out;
      user-select:none;
      transform: translateZ(60px);
    }

    h1{
      font-size:2.4rem;
      letter-spacing:1px;
      margin-bottom:6px;
      background:linear-gradient(to right,#ffffff,var(--accent-light));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      font-weight:900;
      transform: translateZ(55px);
    }

    .tagline{
      display:inline-block;
      font-size:.78rem;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--accent-light);
      margin-bottom:16px;
      font-weight:700;
      opacity:.9;
      transform: translateZ(50px);
    }

    .subtitle{
      color:#94a3b8;
      font-size:1.02rem;
      line-height:1.6;
      margin-bottom:36px;
      min-height: 2.2em;
      transform: translateZ(45px);
    }

    /* Buttons */
    .btn-group{
      display:flex;
      gap:16px;
      justify-content:center;
      transform: translateZ(55px);
    }
    .btn{
      flex:1;
      padding:14px 28px;
      border-radius:14px;
      text-decoration:none;
      font-weight:600;
      font-size:.95rem;
      transition:all .3s ease;
      position:relative;
      overflow:hidden;
      border:1px solid transparent;
      text-align:center;
      isolation:isolate;
    }

    .btn-primary{
      background:linear-gradient(135deg,var(--accent),var(--accent-glow));
      color:#ffffff;
      box-shadow:0 8px 25px -4px var(--accent-glow);
    }
    .btn-primary:hover{
      transform: translateY(-3px);
      box-shadow:0 14px 30px -4px var(--accent);
    }
    .btn-primary::after{
      content:"";
      position:absolute;
      top:-60%;
      left:-70%;
      width:25%;
      height:220%;
      background: rgba(255,255,255,.28);
      transform: rotate(25deg);
      opacity: calc(1 * var(--shimmer));
      animation: shimmer 3.4s infinite;
      z-index:0;
      pointer-events:none;
    }
    .btn-primary span,
    .btn-secondary span{
      position:relative;
      z-index:1;
    }

    .btn-secondary{
      background:rgba(255,255,255,.04);
      color:#e2e8f0;
      border-color:rgba(255,255,255,.12);
    }
    .btn-secondary:hover{
      transform: translateY(-3px);
      background:rgba(139,92,246,.14);
      border-color:var(--accent);
      color:#ffffff;
    }

    /* Top utility bar */
    .top-ui{
      position:absolute;
      top:18px;
      left:18px;
      right:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      z-index: var(--ui-z);
      pointer-events:none;
    }
    .chip{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:14px;
      background: rgba(15,23,42,.55);
      border:1px solid rgba(139,92,246,.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color:#e2e8f0;
      font-size:.88rem;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      user-select:none;
    }
    .dot{
      width:10px; height:10px;
      border-radius:50%;
      background:#22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,.45);
      flex:none;
    }
    .dot.offline{
      background:#ef4444;
      box-shadow: 0 0 14px rgba(239,68,68,.45);
    }
    .icon-btn{
      pointer-events:auto;
      width:44px; height:44px;
      border-radius:14px;
      border:1px solid rgba(139,92,246,.22);
      background: rgba(15,23,42,.55);
      color:#e2e8f0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      cursor:pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .icon-btn:hover{
      transform: translateY(-2px);
      background: rgba(139,92,246,.16);
      border-color: rgba(139,92,246,.55);
    }

    /* Settings drawer */
    .drawer{
      position:absolute;
      top:72px;
      left:18px;
      width:min(360px, calc(100vw - 36px));
      background: rgba(15,23,42,.72);
      border:1px solid rgba(139,92,246,.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,.55), 0 0 25px rgba(139,92,246,.12);
      z-index: var(--ui-z);
      transform: translateY(-10px);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      overflow:hidden;
    }
    .drawer.open{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }
    .drawer header{
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .drawer header b{
      font-size:.95rem;
      color:#f1f5f9;
    }
    .drawer header small{
      color:#94a3b8;
      font-size:.78rem;
    }
    .drawer .content{
      padding:14px;
      display:grid;
      gap:12px;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px;
      background: rgba(2,6,23,.30);
      border:1px solid rgba(255,255,255,.06);
      border-radius:14px;
    }
    .row label{
      font-size:.86rem;
      color:#e2e8f0;
      line-height:1.2;
    }
    .row label span{
      display:block;
      color:#94a3b8;
      font-size:.75rem;
      margin-top:4px;
    }
    .toggle{
      width:54px;height:30px;
      border-radius:999px;
      background: rgba(148,163,184,.25);
      border:1px solid rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      flex:none;
    }
    .toggle::after{
      content:"";
      position:absolute;
      top:3px; left:3px;
      width:24px;height:24px;
      border-radius:50%;
      background:#e2e8f0;
      transition: left .18s ease, background .18s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,.35);
    }
    .toggle.on{
      background: rgba(139,92,246,.35);
      border-color: rgba(139,92,246,.55);
    }
    .toggle.on::after{
      left:27px;
      background: #ffffff;
    }

    .slider{
      width:140px;
      accent-color: var(--accent);
      cursor:pointer;
    }
    .btn-mini{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color:#e2e8f0;
      padding:8px 10px;
      border-radius:12px;
      cursor:pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      font-size:.82rem;
    }
    .btn-mini:hover{transform: translateY(-2px); background: rgba(139,92,246,.14); border-color: rgba(139,92,246,.55);}

    /* Toasts */
    .toasts{
      position:absolute;
      top:18px;
      right:18px;
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index: var(--toast-z);
      pointer-events:none;
    }
    .toast{
      pointer-events:none;
      width:min(360px, calc(100vw - 36px));
      padding:12px 14px;
      border-radius:16px;
      background: rgba(15,23,42,.75);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
      display:flex;
      gap:10px;
      align-items:flex-start;
      animation: toastIn .25s ease;
    }
    .toast .ticon{flex:none; filter: drop-shadow(0 0 14px rgba(139,92,246,.25));}
    .toast .ttext b{display:block; color:#f1f5f9; font-size:.9rem; margin-bottom:3px;}
    .toast .ttext small{color:#94a3b8; font-size:.78rem; line-height:1.4;}
    .toast.success{border-color: rgba(34,197,94,.25);}
    .toast.error{border-color: rgba(239,68,68,.25);}
    .toast.info{border-color: rgba(139,92,246,.28);}

    /* Animations */
    @keyframes moveOrb{from{transform:translate(-30px,-30px);}to{transform:translate(30px,30px);}}
    @keyframes cardEntrance{from{opacity:0;transform:translateY(40px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes floatBadge{from{transform:translateY(0);}to{transform:translateY(-12px);}}
    @keyframes pulseParticle{0%{opacity:.3;transform:scale(.8);}100%{opacity:1;transform:scale(1.6);}}
    @keyframes pulseIcon{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
    @keyframes barPulse{0%{transform:scaleY(.35);opacity:.45;}100%{transform:scaleY(1.25);opacity:1;}}
    @keyframes shimmer{100%{left:160%;}}
    @keyframes borderFlow{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(20deg);}}
    @keyframes toastIn{from{opacity:0;transform: translateY(-8px);}to{opacity:1;transform: translateY(0);}}

    /* Responsive */
    @media (max-width: 900px){
      .floating-badge,.live-chart{display:none;}
      .glass-card{padding:40px 30px;}
    }

    @media (prefers-reduced-motion: reduce){
      *{animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration:.001ms !important;}
      :root{
        --tilt: 0;
        --parallax: 0;
        --mouseLight: 0;
        --shimmer: 0;
        --typewriter: 0;
        --particles: 0.3;
        --orbs: 0.5;
      }
    }
  </style>
</head>

<body>
  <!-- Top UI -->
  <div class="top-ui">
    <div class="chip" id="netChip" title="وضعیت اتصال">
      <span class="dot" id="netDot"></span>
      <span id="netText">Online</span>
    </div>

    <button class="icon-btn" id="btnSettings" title="تنظیمات">
      ⚙️
    </button>
  </div>

  <!-- Settings Drawer -->
  <aside class="drawer" id="drawer">
    <header>
      <div>
        <b>تنظیمات افکت‌ها</b>
        <small>سفارشی‌سازی جلوه‌های گرافیکی تراز</small>
      </div>
      <button class="btn-mini" id="btnReset">ریست</button>
    </header>

    <div class="content">
      <div class="row">
        <label>نور دنبال‌کننده موس <span>Focus Light</span></label>
        <div class="toggle on" data-var="--mouseLight"></div>
      </div>

      <div class="row">
        <label>چرخش ۳بعدی کارت <span>3D Tilt</span></label>
        <div class="toggle on" data-var="--tilt"></div>
      </div>

      <div class="row">
        <label>پارالاکس عمقی <span>Parallax Depth</span></label>
        <div class="toggle on" data-var="--parallax"></div>
      </div>

      <div class="row">
        <label>تایپ خودکار توضیحات <span>Dynamic Text</span></label>
        <div class="toggle on" data-var="--typewriter"></div>
      </div>

      <div class="row">
        <label>درخشش دکمه اصلی <span>Shimmer</span></label>
        <div class="toggle on" data-var="--shimmer"></div>
      </div>

      <div class="row">
        <label>ذرات درخشان <span>Particles</span></label>
        <div class="toggle on" data-var="--particles"></div>
      </div>

      <div class="row">
        <label>هاله‌های نورانی <span>Orbs</span></label>
        <div class="toggle on" data-var="--orbs"></div>
      </div>

      <div class="row">
        <label>شدت Tilt <span>Max Rotation</span></label>
        <input class="slider" id="tiltSlider" type="range" min="4" max="16" value="10" />
      </div>

      <div class="row">
        <label>شدت پارالاکس <span>Depth Strength</span></label>
        <input class="slider" id="parallaxSlider" type="range" min="0" max="20" value="12" />
      </div>

      <div class="row">
        <button class="btn-mini" id="btnToastInfo">تست اعلان</button>
      </div>
    </div>
  </aside>

  <!-- Toast container -->
  <div class="toasts" id="toasts"></div>

  <!-- Background layers -->
  <div class="bg-grid"></div>

  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>

  <span class="particle p1" id="p1"></span>
  <span class="particle p2" id="p2"></span>
  <span class="particle p3" id="p3"></span>
  <span class="particle p4" id="p4"></span>

  <!-- Mini charts -->
  <div class="live-chart chart-left">
    <span style="--h: 22px; --d: 0.1s"></span>
    <span style="--h: 38px; --d: 0.4s"></span>
    <span style="--h: 18px; --d: 0.2s"></span>
    <span style="--h: 46px; --d: 0.6s"></span>
    <span style="--h: 28px; --d: 0.3s"></span>
  </div>

  <div class="live-chart chart-right">
    <span style="--h: 32px; --d: 0.5s"></span>
    <span style="--h: 20px; --d: 0.15s"></span>
    <span style="--h: 44px; --d: 0.7s"></span>
    <span style="--h: 26px; --d: 0.25s"></span>
    <span style="--h: 36px; --d: 0.35s"></span>
  </div>

  <!-- Badges -->
  <div class="floating-badge badge-top-left"><span>📈</span> رشد ماهانه: <b>+۲۴٪</b></div>
  <div class="floating-badge badge-top-right"><span>🔒</span> سیستم امن و رمزنگاری‌شده</div>
  <div class="floating-badge badge-bottom-left"><span>💳</span> تراز بودجه: <b>متعادل</b></div>
  <div class="floating-badge badge-bottom-right"><span>⚡</span> گزارش لحظه‌ای تراکنش‌ها</div>

  <!-- Main card -->
  <div class="card-wrap">
    <div class="glass-card" id="card">
      <div class="deco-line"></div>
      <div class="logo-section">⚖️</div>
      <h1>تــــراز</h1>
      <span class="tagline">TARAZ FINANCE PLATFORM</span>
      <p class="subtitle" id="subtitle">تراز هوشمند دخل و خرج؛ تصمیم‌های دقیق مالی</p>

      <div class="btn-group">
        <a href="{{ url_for('login') }}" class="btn btn-primary" id="btnLogin"><span>ورود به سیستم</span></a>
        <a href="{{ url_for('register') }}" class="btn btn-secondary"><span>ثبت‌نام کاربر</span></a>
      </div>
    </div>
  </div>

  <script>
    // ========= Helpers =========
    const $ = (s) => document.querySelector(s);
    const root = document.documentElement;

    // ========= Network indicator =========
    const netDot = $("#netDot");
    const netText = $("#netText");
    function updateNet(){
      const online = navigator.onLine;
      netDot.classList.toggle("offline", !online);
      netText.textContent = online ? "Online" : "Offline";
      if(!online) toast("خط ارتباط", "اتصال اینترنت قطع شد.", "error");
      else toast("اتصال برقرار", "وضعیت سامانه آنلاین است.", "success");
    }
    window.addEventListener("online", updateNet);
    window.addEventListener("offline", updateNet);

    // ========= Mouse-follow light =========
    let lastBg = 0;
    document.addEventListener("mousemove", (e) => {
      const now = performance.now();
      if(now - lastBg < 20) return;
      lastBg = now;

      const mouseLight = parseFloat(getComputedStyle(root).getPropertyValue("--mouseLight")) || 0;
      if(mouseLight <= 0.01) return;

      const x = e.clientX;
      const y = e.clientY;
      const strength = 0.22 * mouseLight;
      document.body.style.backgroundImage =
        `radial-gradient(circle at ${x}px ${y}px, rgba(139, 92, 246, ${strength}) 0%, #030712 60%)`;
    });

    // ========= 3D Tilt on card =========
    const card = $("#card");
    const wrap = $(".card-wrap");

    function setCardHighlight(px, py){
      card.style.setProperty("--hx", (px * 100).toFixed(1) + "%");
      card.style.setProperty("--hy", (py * 100).toFixed(1) + "%");
    }

    wrap.addEventListener("mousemove", (e) => {
      const tiltOn = parseFloat(getComputedStyle(root).getPropertyValue("--tilt")) || 0;
      if(tiltOn <= 0.01) return;

      const rect = wrap.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      setCardHighlight(x, y);

      const max = getComputedStyle(root).getPropertyValue("--tilt-max").trim() || "10deg";
      const maxDeg = parseFloat(max);
      const rotY = (x - 0.5) * (maxDeg * 2);
      const rotX = -(y - 0.5) * (maxDeg * 2);

      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });

    wrap.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
      setCardHighlight(0.5, 0.4);
    });

    // ========= Parallax depth for orbs/particles =========
    const orb1 = $("#orb1"), orb2 = $("#orb2");
    const p1 = $("#p1"), p2 = $("#p2"), p3 = $("#p3"), p4 = $("#p4");

    let lastPar = 0;
    document.addEventListener("mousemove", (e) => {
      const now = performance.now();
      if(now - lastPar < 16) return;
      lastPar = now;

      const par = parseFloat(getComputedStyle(root).getPropertyValue("--parallax")) || 0;
      if(par <= 0.01) return;

      const rect = document.body.getBoundingClientRect();
      const x = (e.clientX / rect.width) - 0.5;
      const y = (e.clientY / rect.height) - 0.5;

      const strength = parseInt($("#parallaxSlider").value || "12", 10);

      orb1.style.transform = `translate3d(${x * strength * 2}px, ${y * strength * 2}px, 0)`;
      orb2.style.transform = `translate3d(${x * strength * -2.2}px, ${y * strength * -2.2}px, 0)`;

      p1.style.transform = `translate3d(${x * strength * 6}px, ${y * strength * 6}px, 0)`;
      p2.style.transform = `translate3d(${x * strength * -5}px, ${y * strength * -5}px, 0)`;
      p3.style.transform = `translate3d(${x * strength * 4}px, ${y * strength * -4}px, 0)`;
      p4.style.transform = `translate3d(${x * strength * -4}px, ${y * strength * 4}px, 0)`;
    });

    // ========= Typewriter subtitle =========
    const subtitle = $("#subtitle");
    const lines = [
      "تراز هوشمند دخل و خرج؛ تصمیم‌های دقیق مالی",
      "تحلیل نموداری هزینه‌ها و بودجه‌بندی شفاف",
      "کنترل تراکنش‌ها در محیطی سریع، مدرن و رمزنگاری‌شده",
      "آینده مالی خود را با تحلیل هوشمند تراز بسازید"
    ];

    let twIndex = 0, twPos = 0, twDel = false;
    function typewriterTick(){
      const on = (parseFloat(getComputedStyle(root).getPropertyValue("--typewriter")) || 0) > 0.01;
      if(!on) return;

      const text = lines[twIndex];
      if(!twDel){
        twPos++;
        subtitle.textContent = text.slice(0, twPos);
        if(twPos >= text.length){
          twDel = true;
          setTimeout(typewriterTick, 1400);
          return;
        }
      }else{
        twPos--;
        subtitle.textContent = text.slice(0, twPos);
        if(twPos <= 0){
          twDel = false;
          twIndex = (twIndex + 1) % lines.length;
        }
      }
      const speed = twDel ? 20 : 30;
      setTimeout(typewriterTick, speed);
    }
    typewriterTick();

    // ========= Toast system =========
    const toasts = $("#toasts");
    function toast(title, message, type="info", ttl=2800){
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.innerHTML = `
        <div class="ticon">${type === "success" ? "✅" : type === "error" ? "⛔" : "✨"}</div>
        <div class="ttext"><b>${title}</b><small>${message}</small></div>
      `;
      toasts.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-6px)";
        el.style.transition = "all .25s ease";
      }, ttl);
      setTimeout(() => el.remove(), ttl + 260);
    }

    // ========= Settings Drawer =========
    const drawer = $("#drawer");
    const btnSettings = $("#btnSettings");
    const btnReset = $("#btnReset");

    function setVar(name, val){ root.style.setProperty(name, val); }
    function getVar(name){ return getComputedStyle(root).getPropertyValue(name).trim(); }

    function openDrawer(){ drawer.classList.add("open"); }
    function closeDrawer(){ drawer.classList.remove("open"); }

    btnSettings.addEventListener("click", () => {
      drawer.classList.contains("open") ? closeDrawer() : openDrawer();
    });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeDrawer();
    });

    // toggles
    document.querySelectorAll(".toggle").forEach(t => {
      t.addEventListener("click", () => {
        const v = t.getAttribute("data-var");
        const cur = parseFloat(getVar(v)) || 0;
        const next = cur > 0 ? "0" : "1";
        setVar(v, next);
        t.classList.toggle("on", next === "1");
        if(v === "--typewriter" && next === "1") typewriterTick();
      });
    });

    // sliders
    $("#tiltSlider").addEventListener("input", (e) => {
      setVar("--tilt-max", `${e.target.value}deg`);
    });

    $("#btnToastInfo").addEventListener("click", () => {
      toast("سامانه تراز", "تغییرات با موفقیت اعمال شد.", "success");
    });

    btnReset.addEventListener("click", () => {
      ["--mouseLight","--tilt","--parallax","--typewriter","--shimmer","--particles","--orbs"].forEach(v => setVar(v, "1"));
      setVar("--tilt-max", "10deg");
      $("#tiltSlider").value = "10";
      $("#parallaxSlider").value = "12";
      document.querySelectorAll(".toggle").forEach(t => t.classList.add("on"));
      typewriterTick();
      toast("تنظیمات", "تنظیمات به حالت پیش‌فرض بازگشت.", "info");
    });
  </script>
</body>
</html>
