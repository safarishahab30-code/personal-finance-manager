<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد حساب جدید</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=2">
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>ایجاد حساب جدید</h2>
            <p>سامانه مدیریت مالی شخصی</p>
        </div>

        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="حداقل ۳ کاراکتر انگلیسی" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="حداقل ۸ کاراکتر" required>
            </div>
            <div class="form-group">
                <label for="security_question">سوال امنیتی</label>
                <select id="security_question" name="security_question" required>
                    <option value="book">نام اولین کتابی که خواندید چیست؟</option>
                    <option value="city">شهر محل تولد شما کجاست؟</option>
                    <option value="school">نام اولین مدرسه شما چیست؟</option>
                </select>
            </div>
            <div class="form-group">
                <label for="security_answer">پاسخ سوال امنیتی</label>
                <input type="text" id="security_answer" name="security_answer" placeholder="پاسخ امنیتی" required>
            </div>
            <button type="submit" class="btn-submit">ثبت‌نام</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login') }}">ورود به حساب کاربری</a>
        </div>
    </div>
</body>
</html>
