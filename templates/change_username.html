<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر نام کاربری</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d0b14, #1b1226, #241432);
            color: #fff;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            margin-bottom: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #d946ef, #a855f7);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .suggestions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .sug-badge {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>تغییر نام کاربری</h2>
        {% if error %}
            <div class="error">
                {{ error }}
                {% if suggestions %}
                    <div class="suggestions">
                        {% for s in suggestions %}
                            <span class="sug-badge" onclick="document.getElementById('new_username').value='{{ s }}'">{{ s }}</span>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endif %}
        <form method="POST">
            <label>نام کاربری فعلی: <strong>{{ current_username }}</strong></label>
            <label for="new_username">نام کاربری جدید:</label>
            <input type="text" id="new_username" name="new_username" required placeholder="نام کاربری جدید را وارد کنید">
            <button type="submit" class="btn">ثبت نام جدید</button>
            <a href="{{ url_for('dashboard') }}" class="back-link">بازگشت به داشبورد</a>
        </form>
    </div>
</body>
</html>
