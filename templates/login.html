<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=2">
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>ورود به حساب</h2>
            <p>سامانه مدیریت مالی شخصی</p>
        </div>

        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="نام کاربری" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="رمز عبور" required>
            </div>
            <button type="submit" class="btn-submit">ورود</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('forgot_password') }}">فراموشی رمز عبور</a>
            <span style="color: #64748b; margin: 0 5px;">|</span>
            <a href="{{ url_for('register') }}">ایجاد حساب کاربری</a>
        </div>
    </div>
</body>
</html>
