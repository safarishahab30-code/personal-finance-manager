<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازیابی رمز عبور</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <div class="card-wrapper">
        <div class="futuristic-card">
            <div class="auth-header">
                <h2>بازیابی رمز عبور</h2>
                <p>نام کاربری و رمز جدید خود را وارد کنید</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="{% if category == 'success' %}success-box{% else %}error-box{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="username">نام کاربری</label>
                    <div class="input-box">
                        <input type="text" id="username" name="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="new_password">رمز عبور جدید</label>
                    <div class="input-box">
                        <input type="password" id="new_password" name="new_password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">تکرار رمز عبور جدید</label>
                    <div class="input-box">
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>
                <button type="submit" class="btn-action">تغییر رمز عبور</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('login') }}">بازگشت به ورود</a>
            </div>
        </div>
    </div>
</body>
</html>
