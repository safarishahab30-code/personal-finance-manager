<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به سیستم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <div class="card-wrapper">
        <div class="futuristic-card">
            <div class="auth-header">
                <h2>ورود به حساب کاربری</h2>
                <p>برای دسترسی به داشبورد وارد شوید</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="{% if category == 'success' %}success-box{% else %}error-box{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">نام کاربری</label>
                    <div class="input-box">
                        <input type="text" id="username" name="username" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <div class="input-box">
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>
                <button type="submit" class="btn-action">ورود</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('forgot_password') }}">فراموشی رمز عبور؟</a>
                <span> | </span>
                <a href="{{ url_for('register') }}">ایجاد حساب کاربری</a>
            </div>
        </div>
    </div>
</body>
</html>
